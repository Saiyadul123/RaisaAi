name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Organize Project Files & Build
        run: |
          # যদি RaisaAI ফোল্ডারের ভেতরে প্রজেক্ট থাকে, তবে ফাইলগুলোকে রুটে নিয়ে আসা
          if [ -d "RaisaAI" ]; then
            shopt -s dotglob
            mv RaisaAI/* .
            rmdir RaisaAI
          fi

          # গ্র্যাডল র‍্যাপার তৈরি এবং পারমিশন দেওয়া
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

          # লোকাল প্রপার্টিতে এসডিকে পাথ স্বয়ংক্রিয়ভাবে তৈরি করা যাতে এসডিके এরর না দেয়
          echo "sdk.dir=$HOME/android-sdk" > local.properties

          # সরাসরি ডিবাগ এপিকে বিল্ড করা
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RaisaAI-Debug-APK
          path: "app/build/outputs/apk/debug/*.apk"
          retention-days: 7
