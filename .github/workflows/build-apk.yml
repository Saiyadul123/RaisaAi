name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Organize Project Files & Create Wrapper
        run: |
          # যদি RaisaAI ফোল্ডারের ভেতরে প্রজেক্ট থাকে, তবে ফাইলগুলোকে রুটে নিয়ে আসা
          if [ -d "RaisaAI" ]; then
            shopt -s dotglob
            mv RaisaAI/* .
            rmdir RaisaAI
          fi

          # গ্র্যাডল র‍্যাপার নিজে তৈরি করে নেওয়া যাতে অ্যান্ড্রয়েড প্রজেক্ট বিল্ড করতে পারে
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build Debug APK with gradlew
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RaisaAI-Debug-APK
          path: "app/build/outputs/apk/debug/*.apk"
          retention-days: 7
