name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate gradlew, Fix All Bugs, and Build APK
        run: |
          # ১. যদি সরাসরি zip ফাইল আপলোড করা হয়ে থাকে তবে তা আনজিপ করবে
          if [ ! -f "gradlew" ] && [ ! -f "RaisaAI/gradlew" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o -q "$ZIP_FILE"
            fi
          fi

          # ২. প্রজেক্ট ফোল্ডার খুঁজে বের করা
          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew পাওয়া যায়নি!"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"

          # ৩. বাগ ফিক্স ১: ভুল Adaptive Icon XML মুছে ফেলা
          rm -rf app/src/main/res/mipmap-anydpi-v26

          # ৪. বাগ ফিক্স ২: themes.xml-এ Material3 XML থিমের বদলে বিল্ট-ইন থিম দেওয়া (যাতে লাইব্রেরি ছাড়া ক্র্যাশ না করে)
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="Theme.RaisaAI" parent="android:Theme.Material.NoActionBar">\n        <item name="android:statusBarColor">@android:color/transparent</item>\n        <item name="android:navigationBarColor">@android:color/transparent</item>\n    </style>\n</resources>\n' > app/src/main/res/values/themes.xml

          # ৫. বাগ ফিক্স ৩: AndroidManifest.xml থেকে locales_config ও dataExtractionRules এরর দূর করা (যদি থাকে)
          sed -i '/android:localeConfig/d' app/src/main/AndroidManifest.xml

          # ৬. বাগ ফিক্স ৪: ChatRepository.kt ফাইলে HistoryEntry ইমপোর্ট এবং মেথড যোগ করা (printf দিয়ে নিরাপদভাবে)
          printf 'package com.raisa.ai.domain.repository\n\nimport com.raisa.ai.domain.model.ChatMessage\nimport com.raisa.ai.domain.model.HistoryEntry\nimport kotlinx.coroutines.flow.StateFlow\n\ninterface ChatRepository {\n    val messages: StateFlow<List<ChatMessage>>\n    val history: StateFlow<List<HistoryEntry>>\n    suspend fun addMessage(message: ChatMessage)\n    suspend fun recordInteraction(prompt: String, response: String, category: HistoryEntry.Category)\n    suspend fun deleteHistoryItem(id: String)\n    suspend fun clearHistory()\n    suspend fun clearMessages()\n    suspend fun clearAll()\n    suspend fun seedHistoryIfEmpty(seed: List<HistoryEntry>)\n}\n' > app/src/main/java/com/raisa/ai/domain/repository/ChatRepository.kt

          # ৭. বাগ ফিক্স ৫: SettingsRows.kt ও Compose Scope ত্রুটি ঠিক করা
          sed -i 's/trailing: (() -> Unit)? = null/trailing: @Composable (() -> Unit)? = null/g' app/src/main/java/com/raisa/ai/ui/components/SettingsRows.kt
          sed -i 's/private fun BottomNavButton(/private fun androidx.compose.foundation.layout.RowScope.BottomNavButton(/g' app/src/main/java/com/raisa/ai/ui/components/RaisaBottomBar.kt
          sed -i 's/private fun LanguageOptionPill(/private fun androidx.compose.foundation.layout.RowScope.LanguageOptionPill(/g' app/src/main/java/com/raisa/ai/ui/screens/SettingsScreen.kt
          sed -i 's/private fun LanguageOption(/private fun androidx.compose.foundation.layout.RowScope.LanguageOption(/g' app/src/main/java/com/raisa/ai/ui/screens/HomeScreen.kt
          sed -i 's/Modifier.matchParentSize()/Modifier.fillMaxSize()/g' app/src/main/java/com/raisa/ai/ui/components/RaisaAvatar.kt

          # ৮. APK বিল্ড করা
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app/build/outputs/apk/debug/*.apk"
          
