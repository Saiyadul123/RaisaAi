name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate gradlew, Fix All Bugs, and Build APK
        run: |
          # ১. যদি সরাসরি zip ফাইল আপলোড করা হয়ে থাকে তবে তা আনজিপ করবে
          if [ ! -f "gradlew" ] && [ ! -f "RaisaAI/gradlew" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o -q "$ZIP_FILE"
            fi
          fi

          # ২. প্রজেক্ট ফোল্ডার খুঁজে বের করা
          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew পাওয়া যায়নি!"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"

          # ৩. বাগ ফিক্স ১: ভুল Adaptive Icon XML মুছে ফেলা
          rm -rf app/src/main/res/mipmap-anydpi-v26

          # ৪. বাগ ফিক্স ২: ChatRepository.kt ফাইলে HistoryEntry ইমপোর্ট এবং মেথড যোগ করা
          cat << 'EOF' > app/src/main/java/com/raisa/ai/domain/repository/ChatRepository.kt
          package com.raisa.ai.domain.repository

          import com.raisa.ai.domain.model.ChatMessage
          import com.raisa.ai.domain.model.HistoryEntry
          import kotlinx.coroutines.flow.StateFlow

          interface ChatRepository {
              val messages: StateFlow<List<ChatMessage>>
              val history: StateFlow<List<HistoryEntry>>

              suspend fun addMessage(message: ChatMessage)
              suspend fun recordInteraction(prompt: String, response: String, category: HistoryEntry.Category)
              suspend fun deleteHistoryItem(id: String)
              suspend fun clearHistory()
              suspend fun clearMessages()
              suspend fun clearAll()
              suspend fun seedHistoryIfEmpty(seed: List<HistoryEntry>)
          }
          EOF

          # ৫. বাগ ফিক্স ৩: SettingsRows.kt ফাইলে @Composable টাইপ ঠিক করা
          sed -i 's/trailing: (() -> Unit)? = null/trailing: @Composable (() -> Unit)? = null/g' app/src/main/java/com/raisa/ai/ui/components/SettingsRows.kt

          # ৬. বাগ ফিক্স ৪: Compose RowScope/BoxScope-এর weight ও matchParentSize ত্রুটি ঠিক করা
          sed -i 's/private fun BottomNavButton(/private fun androidx.compose.foundation.layout.RowScope.BottomNavButton(/g' app/src/main/java/com/raisa/ai/ui/components/RaisaBottomBar.kt
          sed -i 's/private fun LanguageOptionPill(/private fun androidx.compose.foundation.layout.RowScope.LanguageOptionPill(/g' app/src/main/java/com/raisa/ai/ui/screens/SettingsScreen.kt
          sed -i 's/private fun LanguageOption(/private fun androidx.compose.foundation.layout.RowScope.LanguageOption(/g' app/src/main/java/com/raisa/ai/ui/screens/HomeScreen.kt
          sed -i 's/Modifier.matchParentSize()/Modifier.fillMaxSize()/g' app/src/main/java/com/raisa/ai/ui/components/RaisaAvatar.kt

          # ৭. APK বিল্ড করা
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app/build/outputs/apk/debug/*.apk"
          
