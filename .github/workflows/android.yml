name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate gradlew, Fix Bugs, and Build APK
        run: |
          # 1. Extract zip if uploaded directly
          if [ ! -f "gradlew" ] && [ ! -f "RaisaAI/gradlew" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o -q "$ZIP_FILE"
            fi
          fi

          # 2. Find project directory
          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"

          # 3. Fix Bug #1: Remove broken adaptive icon XMLs (fallback to your valid PNGs in mipmap-*)
          rm -rf app/src/main/res/mipmap-anydpi-v26

          # 4. Fix Bug #2: Add missing seedHistoryIfEmpty method to ChatRepository interface
          if ! grep -q "seedHistoryIfEmpty" app/src/main/java/com/raisa/ai/domain/repository/ChatRepository.kt; then
            sed -i 's/suspend fun clearAll()/suspend fun clearAll()\n    suspend fun seedHistoryIfEmpty(seed: List<HistoryEntry>)/' app/src/main/java/com/raisa/ai/domain/repository/ChatRepository.kt
          fi

          # 5. Build the Debug APK
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app/build/outputs/apk/debug/*.apk"
          
