name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate gradlew and Build APK
        run: |
          # 1. If a zip file was uploaded directly, extract it first
          if [ ! -f "gradlew" ] && [ ! -f "RaisaAI/gradlew" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting $ZIP_FILE..."
              unzip -q "$ZIP_FILE"
            fi
          fi

          # 2. Automatically find where gradlew is located
          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew not found anywhere in the repository!"
            ls -la
            exit 1
          fi

          # 3. Enter the project directory and build
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app/build/outputs/apk/debug/*.apk"
